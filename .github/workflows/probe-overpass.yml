name: Probe marina lookup
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: App query around Penarth Marina
        run: |
          Q='[out:json][timeout:25];nwr(around:450,51.44620,-3.17440)->.a;(nwr.a["amenity"~"^(toilets|shower|drinking_water|water_point|sanitary_dump_station|waste_disposal|recycling|restaurant|cafe|pub|bar|fast_food|atm)$"];nwr.a["shop"~"^(boat|chandler|ship_chandler|marine|supermarket|convenience|laundry|boat_repair)$"];nwr.a["craft"~"^(boatbuilder|sailmaker)$"];nwr.a["waterway"~"^(fuel|sanitary_dump_station|boatyard)$"];nwr.a["leisure"~"^(slipway|marina)$"];nwr.a["seamark:type"];nwr.a["man_made"="crane"];nwr.a["club"="sailing"];nwr.a["office"="harbour_master"];nwr.a["phone"];nwr.a["contact:phone"];nwr.a["website"];nwr.a["contact:website"];nwr.a["email"];);out center tags 400;'
          for ep in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter; do
            s=$(date +%s.%N); code=$(curl -s -o out.json -w "%{http_code}" --max-time 45 -A "OpenHelm/2.1 (Android chart plotter)" --data-urlencode "data=$Q" "$ep"); t=$(echo "$(date +%s.%N) - $s" | bc)
            echo "::notice::$ep -> HTTP $code, $(jq '.elements|length' out.json 2>/dev/null) elements, ${t}s"
            [ "$code" = 200 ] && cp out.json good.json
          done
          jq -r '[.elements[]|.tags.name//empty]|unique|join(", ")' good.json | cut -c1-900 | sed 's/^/::notice::names: /'
          jq -r '[.elements[]|select(.tags.phone or .tags["contact:phone"])|"\(.tags.name//"-"): \(.tags.phone//.tags["contact:phone"])"]|join(" ; ")' good.json | cut -c1-900 | sed 's/^/::notice::phones: /'
