name: Probe marina lookup
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare queries around Penarth Marina
        run: |
          A='around:450,51.4462,-3.1744'
          OLD="[out:json][timeout:20];(nwr($A)[\"amenity\"~\"^(toilets|shower|drinking_water|restaurant|cafe|pub|bar)\$\"];nwr($A)[\"shop\"~\"^(boat|chandler|supermarket|convenience)\$\"];nwr($A)[\"waterway\"=\"fuel\"];nwr($A)[\"leisure\"~\"^(slipway|marina)\$\"];nwr($A)[\"seamark:type\"];nwr($A)[\"phone\"];nwr($A)[\"contact:phone\"];nwr($A)[\"website\"];nwr($A)[\"contact:website\"];);out center tags 400;"
          NEW="[out:json][timeout:25];nwr($A)->.a;(nwr.a[\"amenity\"~\"^(toilets|shower|drinking_water|restaurant|cafe|pub|bar)\$\"];nwr.a[\"shop\"~\"^(boat|chandler|supermarket|convenience)\$\"];nwr.a[\"waterway\"=\"fuel\"];nwr.a[\"leisure\"~\"^(slipway|marina)\$\"];nwr.a[\"seamark:type\"];nwr.a[\"phone\"];nwr.a[\"contact:phone\"];nwr.a[\"website\"];nwr.a[\"contact:website\"];);out center tags 400;"
          for ep in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter; do
            for q in OLD NEW; do
              s=$(date +%s.%N); code=$(curl -s -o out.json -w "%{http_code}" --max-time 60 --data-urlencode "data=${!q}" "$ep"); t=$(echo "$(date +%s.%N) - $s" | bc)
              n=$(jq '.elements|length' out.json 2>/dev/null || echo "?"); rem=$(jq -r '.remark // ""' out.json 2>/dev/null | head -c 200)
              echo "::notice::$ep $q -> HTTP $code, $n elements, ${t}s $rem"
            done
          done
          jq -r '.elements[]|[.tags.name//"-",(.tags|to_entries|map(select(.key|test("^(amenity|shop|leisure|waterway|seamark:type|phone|contact:phone|website|vhf|operator)$"))|"\(.key)=\(.value)")|join(" "))]|join(" | ")' out.json | head -40
