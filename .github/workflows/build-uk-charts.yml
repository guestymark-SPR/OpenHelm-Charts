name: Build UK chart packs

# One pass over Great Britain + Ireland OpenStreetMap data and the UK EMODnet depth grid,
# then cut into regional offline chart packs (tools/regions.json), each published as release charts-<id>.
on:
  workflow_dispatch:
    inputs:
      bounds:
        description: Whole area west,south,east,north
        default: "-11.0,49.7,2.2,61.1"

permissions:
  contents: write

jobs:
  uk:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      BOUNDS: ${{ inputs.bounds }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1 | sed 's/^/::notice::disk /'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin osmium-tool sqlite3 libsqlite3-dev zlib1g-dev build-essential unzip > /dev/null
          git clone -q --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -s -C /tmp/tippecanoe -j4 && sudo make -s -C /tmp/tippecanoe install
          curl -fsSL -o planetiler.jar https://github.com/onthegomap/planetiler/releases/latest/download/planetiler.jar

      - name: Restore cached UK base map
        id: basecache
        uses: actions/cache/restore@v4
        with:
          path: |
            base.mbtiles
            uk.osm.pbf
            water.zip
          key: uk-base-v1

      - name: Base map from OpenStreetMap (Great Britain + Ireland)
        if: steps.basecache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o gb.osm.pbf https://download.geofabrik.de/europe/great-britain-latest.osm.pbf
          curl -fsSL -o ie.osm.pbf https://download.geofabrik.de/europe/ireland-and-northern-ireland-latest.osm.pbf
          osmium merge gb.osm.pbf ie.osm.pbf -o uk.osm.pbf --overwrite && rm gb.osm.pbf ie.osm.pbf
          ls -la uk.osm.pbf | sed 's/^/::notice::/'
          java -Xmx13g -jar planetiler.jar --download --osm-path=uk.osm.pbf --bounds="$BOUNDS" --maxzoom=14 \
            --exclude_layers=building,housenumber,poi,aerodrome_label,park \
            --output=base.mbtiles --force > planetiler.log 2>&1 || true
          tail -12 planetiler.log
          if [ ! -s base.mbtiles ] || [ $(stat -c %s base.mbtiles) -lt 1000000 ]; then grep -iE "error|exception|invalid|fail|memory" planetiler.log | head -15 | sed 's/^/::error::/'; tail -8 planetiler.log | sed 's/^/::error::/'; exit 1; fi
          cp "$(ls data/sources/water*polygons*.zip | head -1)" water.zip
          rm -rf data/tmp
          echo "::notice::base.mbtiles $(du -h base.mbtiles | cut -f1)"

      - name: Save UK base map for re-runs
        if: steps.basecache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            base.mbtiles
            uk.osm.pbf
            water.zip
          key: uk-base-v1

      - name: Seamarks and marinas
        run: |
          set -o pipefail
          osmium tags-filter uk.osm.pbf nwr/seamark:type nwr/leisure=marina,slipway nw/waterway=fuel,sanitary_dump_station,boatyard nwr/amenity=toilets,shower,drinking_water,water_point,sanitary_dump_station,waste_disposal,recycling,restaurant,cafe,pub,bar,fast_food,atm nwr/shop=boat,chandler,ship_chandler,marine,supermarket,convenience,laundry,boat_repair nwr/craft=boatbuilder,sailmaker n/man_made=crane nwr/club=sailing nwr/office=harbour_master nwr/phone nwr/contact:phone nwr/website nwr/contact:website -o sea.osm.pbf --overwrite
          osmium export sea.osm.pbf -o sea.geojsonseq -f geojsonseq --overwrite --geometry-types=point,linestring,polygon -a type,id
          python3 tools/seamarks.py sea.geojsonseq seamarks.geojsonseq
          echo "::notice::seamark features $(wc -l < seamarks.geojsonseq)"
          tippecanoe -o seamarks.mbtiles -l seamark -Z9 -z14 -r1 --no-feature-limit --no-tile-size-limit -P --force seamarks.geojsonseq > /dev/null 2>&1 || { echo "::error::seamark tiling failed"; exit 1; }

      - name: Depth from EMODnet Bathymetry (masked to the sea)
        run: |
          set -o pipefail
          IFS=, read W S E N <<< "$BOUNDS"
          python3 tools/emodnet.py "$W" "$S" "$E" "$N" depth.tif > emodnet.log 2>&1 || { tail -5 emodnet.log | sed 's/^/::error::/'; exit 1; }
          SHP=$(unzip -Z1 water.zip | grep '\.shp$' | head -1)
          ogr2ogr -f "ESRI Shapefile" water.shp "/vsizip/water.zip/$SHP" -spat "$W" "$S" "$E" "$N" -spat_srs EPSG:4326 -t_srs EPSG:4326 -nln water -nlt PROMOTE_TO_MULTI
          gdal_translate -q -ot Float32 depth.tif masked.tif
          gdal_rasterize -q -i -at -burn 99999 -l water water.shp masked.tif
          gdal_translate -q -a_nodata 99999 -co COMPRESS=DEFLATE -co BIGTIFF=IF_SAFER masked.tif depth.tif && rm masked.tif
          gdalinfo depth.tif | grep "Size is" | sed 's/^/::notice::depth grid /'
          gdal_contour -q -p -amin emin -amax emax -fl -2000 -1000 -500 -200 -100 -50 -30 -20 -15 -10 -5 -2 0 5 depth.tif areas.shp
          gdal_contour -q -a elev -fl -2000 -1000 -500 -200 -100 -50 -30 -20 -15 -10 -5 -2 0 depth.tif contours.shp
          ogr2ogr -f GeoJSONSeq -t_srs EPSG:4326 areas.geojsonseq areas.shp -sql "SELECT -emax AS dmin, -emin AS dmax FROM areas WHERE emin < 5"
          ogr2ogr -f GeoJSONSeq -t_srs EPSG:4326 contours.geojsonseq contours.shp -sql "SELECT -elev AS depth FROM contours"
          python3 tools/soundings.py depth.tif soundings.geojsonseq | sed 's/^/::notice::/'
          tippecanoe -o depth.mbtiles -Z5 -z14 --force -P --no-tile-size-limit --coalesce-densest-as-needed --simplification=4 \
            -L'{"file":"areas.geojsonseq","layer":"depth_area"}' -L'{"file":"contours.geojsonseq","layer":"depth_contour"}' \
            -L'{"file":"soundings.geojsonseq","layer":"sounding"}' > tippecanoe.log 2>&1 || { tail -5 tippecanoe.log | sed 's/^/::error::/'; exit 1; }
          echo "::notice::depth.mbtiles $(du -h depth.mbtiles | cut -f1)"

      - name: Cut regional packs
        run: python3 tools/split_packs.py tools/regions.json packs base.mbtiles seamarks.mbtiles depth.mbtiles

      - name: Publish each pack as a release
        run: |
          for f in packs/*.mbtiles; do
            id=$(basename "$f" .mbtiles)
            title=$(python3 -c "import json,sys;print(next(r['title'] for r in json.load(open('tools/regions.json')) if r['id']=='$id'))")
            gh release view "charts-$id" > /dev/null 2>&1 || gh release create "charts-$id" --title "Chart pack – $title" --notes "OpenHelm offline chart pack from OpenStreetMap and EMODnet Bathymetry (depths at chart datum, LAT)."
            gh release upload "charts-$id" "$f" --clobber
            echo "::notice::published charts-$id"
          done
